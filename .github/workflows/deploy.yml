name: Deploy Plotline to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux pushes rapproches declenchaient deux deploiements en parallele sur la
# meme VPS: le second ecrasait .output pendant que le premier y ecrivait
# encore, produisant un build incomplet servi en production (chunks
# manquants, 500 en boucle). Un seul deploiement a la fois; le suivant
# attend son tour au lieu d etre annule, pour ne jamais interrompre un
# npm run build a mi-chemin.
concurrency:
  group: deploy-plotline
  cancel-in-progress: false

env:
  REMOTE_DIR: /srv/saas/plotline

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add SSH key to agent
        uses: webfactory/ssh-agent@v0.6.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -euo pipefail
          cd /srv/saas/plotline || exit 1
          # GitHub limite ponctuellement les telechargements non authentifies:
          # un echec ici est transitoire et ne justifie pas de rater un deploiement.
          for attempt in 1 2 3; do
            if git fetch --all --prune; then
              break
            fi
            echo "git fetch echoue (tentative $attempt/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 15
          done
          git reset --hard origin/main
          npm ci
          npx prisma generate

          # Le build precedent est conserve tant que le nouveau n a pas abouti.
          # Supprimer .output avant de construire laissait la production sans
          # fichiers des que le build echouait: pm2 continuait de servir un
          # index.html referencant des chunks disparus, d ou des 500 en cascade.
          rm -rf .output.prev
          if [ -d .output ]; then
            mv .output .output.prev
          fi

          if npm run build; then
            rm -rf .output.prev
          else
            echo "Build echoue: restauration de la version precedente"
            rm -rf .output
            if [ -d .output.prev ]; then
              mv .output.prev .output
            fi
            exit 1
          fi

          if pm2 describe plotline > /dev/null 2>&1; then
            pm2 reload plotline --update-env
          else
            pm2 start ecosystem.config.cjs
          fi
          EOF
